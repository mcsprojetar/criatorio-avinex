<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contato | Criatório Avinex</title>
<meta name="description" content="Fale com o Criatório Avinex pelo WhatsApp ou Instagram.">
<meta property="og:title" content="Contato | Criatório Avinex">
<meta property="og:description" content="Fale com o Criatório Avinex pelo WhatsApp ou Instagram.">
<meta name="theme-color" content="#2F3B27">
<link rel="icon" href="favicon/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-pagina="contato">

<header data-header></header>

<main>
  <section>
    <div class="container secao-cabecalho">
      <span class="eyebrow">Contato</span>
      <h1>Fale conosco</h1>
      <p>Estamos à disposição para tirar dúvidas, informar disponibilidade e receber seu pedido.</p>
    </div>

    <div class="container contato-grid">
      <a href="#" id="contato-whatsapp" target="_blank" rel="noopener" class="contato-card">
        <span class="icone">💬</span>
        <h3>WhatsApp</h3>
        <p id="contato-whatsapp-numero"></p>
        <span class="botao botao-whatsapp botao-pequeno">Falar no WhatsApp</span>
      </a>

      <a href="#" id="contato-instagram" target="_blank" rel="noopener" class="contato-card">
        <span class="icone">📷</span>
        <h3>Instagram</h3>
        <p id="contato-instagram-usuario"></p>
        <span class="botao botao-acento botao-pequeno">Seguir no Instagram</span>
      </a>
    </div>

    <div class="container" style="text-align:center; margin-top: 48px;">
      <a href="#" id="contato-whatsapp-grande" target="_blank" rel="noopener" class="botao botao-primario botao-grande">Falar no WhatsApp</a>
    </div>
  </section>
</main>

<footer data-footer></footer>

<div data-whatsapp-flutuante></div>

<script src="js/config.js"></script>
<script src="js/produtos.js"></script>
<script src="js/carrinho.js"></script>
<script src="js/app.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const link = linkWhatsApp("Olá! Vim pelo site do Criatório Avinex e gostaria de falar com vocês.");
    document.getElementById("contato-whatsapp").href = link;
    document.getElementById("contato-whatsapp-grande").href = link;
    document.getElementById("contato-whatsapp-numero").textContent = CONFIG.WHATSAPP_EXIBICAO;
    document.getElementById("contato-instagram").href = CONFIG.INSTAGRAM_URL;
    document.getElementById("contato-instagram-usuario").textContent = CONFIG.INSTAGRAM_USUARIO;
  });
</script>
</body>
</html>
